<HTML><HEAD><TITLE>Planes</TITLE></HEAD><BODY BGCOLOR="#ffffff" TEXT="#000040" LINK="#000099" ALINK="#0000ff" VLINK="#000099"><BLOCKQUOTE><P><BR><B>Planes</B><BR><HR><P><MENU>          i miss you most<BR>                in the cramped space<BR>                between countries<BR><BR>                the unreal time<BR>                sipping champagne<BR>                so far above home<BR><BR>                the itch of awful<BR>                and unreasonable<BR>                hard crash fear<BR><BR>                i miss you most<BR>                in the tight breath<BR>                of landing.<BR></MENU><BR><BR><BR><FONT SIZE="-2"><TT>&copy;1996 Noah Christy Brown.</TT></FONT><BR><HR SIZE=1><BR><BR><BR><A HREF="scrawlz.html">Back to the poem index</A></BLOCKQUOTE></BODY></HTML>
